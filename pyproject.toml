[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gil-concurrency-research"
version = "1.0.0"
description = "Demonstration of GIL race conditions and PEP 703 impacts"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
